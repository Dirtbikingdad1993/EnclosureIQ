<title>EnclosureIQ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Design subwoofer enclosures for your car or truck: sub, amp and vehicle libraries, acoustic simulation, 360° view and build plans.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: sticky workshop toolbar over a two-column bench (controls | live results); single column on phones. */
:root {
  --bg: #f2f1ed; --surface: #ffffff; --surface-2: #ebe9e3; --ink: #1b1d20; --ink-2: #5c6067; --line: #d9d6ce;
  --accent: #d9480f; --accent-ink: #ffffff; --accent-soft: #fbe3d6; --blue: #1f5f99;
  --mdf: #e6d3b0; --mdf-edge: #b08a58; --hole: #2e3135; --port: #7a5230;
  --good: #2b8a3e; --good-bg: #e5f3e8; --warn: #a86a12; --warn-bg: #fbf0da; --bad: #c92a2a; --bad-bg: #fbe6e6;
  --font-display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --font-body: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
  --radius: 10px; --gutter: max(16px, env(safe-area-inset-left, 0px));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121417; --surface: #1a1d21; --surface-2: #24282e; --ink: #ecebe6; --ink-2: #a5a9b0; --line: #32373e;
  --accent: #ff7a3d; --accent-ink: #1a1d21; --accent-soft: #3a2418; --blue: #78b2ea;
  --mdf: #6c5739; --mdf-edge: #a8885c; --hole: #0b0c0e; --port: #d9a878;
  --good: #5ccb70; --good-bg: #17301e; --warn: #f0bb4f; --warn-bg: #33280f; --bad: #ff7070; --bad-bg: #3a1a1a; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #121417; --surface: #1a1d21; --surface-2: #24282e; --ink: #ecebe6; --ink-2: #a5a9b0; --line: #32373e;
  --accent: #ff7a3d; --accent-ink: #1a1d21; --accent-soft: #3a2418; --blue: #78b2ea;
  --mdf: #6c5739; --mdf-edge: #a8885c; --hole: #0b0c0e; --port: #d9a878;
  --good: #5ccb70; --good-bg: #17301e; --warn: #f0bb4f; --warn-bg: #33280f; --bad: #ff7070; --bad-bg: #3a1a1a; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--ink); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; letter-spacing: 0.01em; text-wrap: balance; margin: 0; line-height: 1.1; }
h1 { font-size: clamp(1.9rem, 4vw, 2.6rem); text-transform: uppercase; }
h2 { font-size: 1.35rem; text-transform: uppercase; letter-spacing: 0.03em; }
h3 { font-size: 1.12rem; }
p { margin: 0; }
a { color: var(--blue); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.mono, .num { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.small { font-size: 0.86em; }
.eyebrow { font-family: var(--font-mono); font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }

/* top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--ink); color: var(--bg); }
.topbar-inner { max-width: 1480px; margin: 0 auto; display: flex; align-items: center; gap: 18px; padding-block: 8px; padding-left: var(--gutter); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 8px; color: inherit; text-decoration: none; flex: none; }
.brand-name { font-family: var(--font-display); font-weight: 700; font-size: 1.5rem; letter-spacing: 0.04em; }
.brand-name b { color: var(--accent); font-weight: 700; }
.brand-sub { font-family: var(--font-mono); font-size: 0.68rem; opacity: 0.6; text-transform: uppercase; letter-spacing: 0.1em; }
.nav { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; flex: 1; min-width: 0; }
.nav::-webkit-scrollbar { display: none; }
.nav a { color: inherit; text-decoration: none; padding: 8px 11px; border-radius: 7px; white-space: nowrap; opacity: 0.75; font-weight: 500; font-size: 0.93rem; }
.nav a:hover { opacity: 1; background: rgba(255,255,255,0.08); }
.nav a[aria-current="page"] { opacity: 1; background: var(--accent); color: var(--accent-ink); }
.topbar-tools { display: flex; align-items: center; gap: 8px; flex: none; }
.topbar .seg { background: rgba(255,255,255,0.1); border-color: transparent; }
.topbar .seg button { color: var(--bg); }
.topbar .seg button.on { background: var(--bg); color: var(--ink); }
.ai-btn { background: transparent; color: var(--bg); border-color: rgba(255,255,255,0.25); }
.ai-btn:hover { border-color: var(--accent); }
.ai-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); display: inline-block; margin-right: 6px; box-shadow: 0 0 0 3px rgba(255,122,61,0.25); }
@media (max-width: 900px) {
  .topbar-inner { flex-wrap: wrap; row-gap: 4px; }
  .brand-sub { display: none; }
  .nav { order: 3; flex-basis: 100%; }
}

/* page */
.view { max-width: 1480px; margin: 0 auto; padding-block: 22px 40px; padding-left: var(--gutter); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: block; }
.page-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 14px; margin-bottom: 18px; }
.foot { max-width: 1480px; margin: 0 auto; padding-block: 12px 28px; padding-left: var(--gutter); padding-right: max(16px, env(safe-area-inset-right, 0px)); color: var(--ink-2); font-size: 0.82rem; border-top: 1px solid var(--line); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; min-width: 0; }
.card-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 10px; }
.group-title { margin: 22px 0 10px; }
.sub-head { margin: 18px 0 10px; }

/* buttons & controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; padding: 8px 14px; cursor: pointer; font-weight: 500; line-height: 1.2; text-align: center; }
.btn:hover { border-color: var(--ink-2); }
.btn:disabled { opacity: 0.55; cursor: progress; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.btn-sm { padding: 5px 10px; font-size: 0.86rem; border-radius: 7px; }
.btn[aria-pressed="true"] { background: var(--ink); color: var(--surface); border-color: var(--ink); }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn-col { display: flex; flex-direction: column; gap: 6px; }
.icon-btn { border: 0; background: transparent; font-size: 1.1rem; cursor: pointer; padding: 6px 9px; border-radius: 6px; color: var(--ink-2); }
.icon-btn:hover { background: var(--surface-2); color: var(--ink); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field-label { font-size: 0.8rem; font-weight: 600; color: var(--ink-2); }
.field-input { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); overflow: hidden; }
.field-input:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.field-input input, .field-input select { border: 0; background: transparent; padding: 8px 10px; width: 100%; min-width: 0; outline: none; }
.field-input input[type="number"] { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.field-input input:disabled { color: var(--ink-2); }
.field-unit { padding: 0 10px; color: var(--ink-2); font-size: 0.82rem; font-family: var(--font-mono); background: var(--surface-2); align-self: stretch; display: flex; align-items: center; }
.field-hint { font-size: 0.78rem; color: var(--ink-2); }
.field-wide { grid-column: 1 / -1; }
textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface); resize: vertical; }
textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.row2, .row3 { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.row3 { grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); }
.seg { display: inline-flex; flex-wrap: wrap; gap: 2px; border: 1px solid var(--line); border-radius: 9px; padding: 3px; background: var(--surface-2); }
.seg button { border: 0; background: transparent; padding: 6px 10px; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 0.88rem; color: var(--ink-2); }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,0.12); font-weight: 600; }
.seg-sm button { padding: 3px 9px; font-size: 0.8rem; }
.toggle { display: inline-flex; align-items: center; gap: 9px; cursor: pointer; font-size: 0.9rem; }
.toggle input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.toggle-track { width: 36px; height: 20px; border-radius: 20px; background: var(--line); position: relative; flex: none; transition: background .15s; }
.toggle-track::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); box-shadow: 0 1px 2px rgba(0,0,0,.3); transition: transform .15s; }
.toggle input:checked + .toggle-track { background: var(--accent); }
.toggle input:checked + .toggle-track::after { transform: translateX(16px); }
.toggle input:focus-visible + .toggle-track { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px dashed var(--line); background: transparent; border-radius: 20px; padding: 4px 10px; font-size: 0.8rem; cursor: pointer; color: var(--ink-2); font-family: var(--font-mono); }
.chip:hover, .chip.on { border-style: solid; border-color: var(--accent); color: var(--ink); }
.pill { display: inline-flex; align-items: center; padding: 3px 9px; border-radius: 20px; font-size: 0.78rem; font-weight: 600; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.pill.good { background: var(--good-bg); color: var(--good); }
.pill.warn { background: var(--warn-bg); color: var(--warn); }
.pill.bad { background: var(--bad-bg); color: var(--bad); }
.note { font-size: 0.88rem; padding: 8px 10px; border-radius: 8px; background: var(--surface-2); border-left: 3px solid var(--ink-2); }
.note.warn { background: var(--warn-bg); border-left-color: var(--warn); }
.note.bad { background: var(--bad-bg); border-left-color: var(--bad); }
.issues { display: flex; flex-direction: column; gap: 6px; }
.mini-select { border: 1px solid var(--line); border-radius: 7px; padding: 4px 8px; background: var(--surface); font-size: 0.86rem; }

/* design workspace */
.design-grid { display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 1040px) { .design-grid { grid-template-columns: minmax(340px, 430px) minmax(0, 1fr); align-items: start; } }
.autotune { border: 1px dashed var(--accent); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; background: var(--accent-soft); }
.design-controls, .design-results { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.design-name { display: flex; flex-direction: column; gap: 8px; }
.step { display: flex; flex-direction: column; gap: 12px; }
.step-title { display: flex; align-items: center; gap: 10px; font-size: 1.2rem; text-transform: uppercase; letter-spacing: 0.04em; }
.step-num { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--accent); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 0.82rem; font-weight: 500; flex: none; }
.loc-box { display: flex; flex-direction: column; gap: 8px; padding: 10px; border-radius: 8px; background: var(--surface-2); }
.loc-dims { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-family: var(--font-mono); font-size: 0.84rem; }
.spec-strip { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.spec-strip span { background: var(--surface); padding: 6px 8px; font-family: var(--font-mono); font-size: 0.86rem; display: flex; flex-direction: column; }
.spec-strip small { font-family: var(--font-body); color: var(--ink-2); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; }
.type-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.type-card { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 8px 6px 9px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; color: var(--ink-2); font-size: 0.78rem; line-height: 1.25; text-align: center; }
.type-card:hover { border-color: var(--ink-2); color: var(--ink); }
.type-card.on { border-color: var(--accent); color: var(--ink); background: var(--accent-soft); font-weight: 600; }
.type-card svg { color: var(--ink); }
.type-card.on svg { color: var(--accent); }
.chamber { border: 1px solid var(--line); border-radius: 8px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.chamber-head { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.calc-line { font-size: 0.9rem; background: var(--surface-2); padding: 8px 10px; border-radius: 8px; }
.calc-line b { font-family: var(--font-mono); color: var(--accent); }
.wire-list { display: grid; gap: 6px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.wire { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 9px; text-align: left; display: flex; flex-direction: column; gap: 1px; cursor: pointer; font-size: 0.78rem; color: var(--ink-2); }
.wire b { font-family: var(--font-mono); font-size: 1rem; color: var(--ink); }
.wire em { font-style: normal; font-family: var(--font-mono); color: var(--good); }
.wire.on { border-color: var(--accent); background: var(--accent-soft); }
.wire.unsafe em { color: var(--bad); }

/* results */
.status-row { display: flex; flex-wrap: wrap; gap: 6px; }
.stats { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--ink-2); font-weight: 600; }
.stat-value { font-family: var(--font-mono); font-size: 1.12rem; font-weight: 500; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.stat-sub { font-size: 0.78rem; color: var(--ink-2); }
.stat.good { box-shadow: inset 3px 0 0 var(--good); }
.stat.warn { box-shadow: inset 3px 0 0 var(--warn); }
.stat.bad { box-shadow: inset 3px 0 0 var(--bad); }
.fit { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 0.84rem; font-family: var(--font-mono); }
.fit-item.good b { color: var(--good); }
.fit-item.bad { color: var(--bad); }
.tabs { display: flex; flex-wrap: wrap; gap: 2px 4px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
.tabs button { border: 0; background: transparent; padding: 8px 11px; border-bottom: 2.5px solid transparent; cursor: pointer; white-space: nowrap; color: var(--ink-2); font-weight: 500; font-size: 0.9rem; }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
.chart { display: flex; flex-direction: column; gap: 6px; }
.chart-svg { width: 100%; min-width: 0; }
.chart-svg svg { display: block; width: 100%; height: auto; touch-action: pan-y; }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart .grid line.minor { stroke: var(--line); opacity: 0.45; }
.chart .tick { fill: var(--ink-2); font-size: 11px; font-family: var(--font-mono); }
.chart .axis { fill: var(--ink-2); font-size: 11px; font-weight: 600; }
.chart .ref { font-size: 11px; font-family: var(--font-mono); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; }
.chart .cursor { stroke: var(--ink-2); stroke-dasharray: 3 3; }
.chart-legend, .chart-readout { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 0.8rem; color: var(--ink-2); }
.chart-legend i, .chart-readout i { display: inline-block; width: 12px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.chart-readout { font-family: var(--font-mono); min-height: 1.4em; }
.chart-readout b { color: var(--ink); }
.chart-caption { font-size: 0.82rem; color: var(--ink-2); max-width: 75ch; }
.orbit { display: flex; flex-direction: column; gap: 8px; }
.orbit-canvas { width: 100%; cursor: grab; touch-action: none; border-radius: 8px; background: radial-gradient(ellipse at 50% 35%, var(--surface) 0%, var(--surface-2) 100%); user-select: none; }
.orbit-canvas:active { cursor: grabbing; }
.orbit-canvas svg { display: block; width: 100%; height: auto; }
.o-dim { fill: var(--blue); font-size: 12px; font-family: var(--font-mono); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; }
.o-shadow { fill: var(--ink); opacity: 0.1; }
.orbit-controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }
.orbit-angle { font-family: var(--font-mono); font-size: 0.78rem; color: var(--ink-2); }

/* libraries */
.filter-bar { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 16px; }
.filter-bar input, .filter-bar select { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 8px 11px; min-width: 0; }
.filter-bar input { flex: 1 1 240px; }
.lib-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); }
.lib-card { display: flex; flex-direction: column; gap: 10px; }
.lib-card-head { display: flex; justify-content: space-between; gap: 10px; align-items: flex-start; }
.lib-card h3 { font-size: 1.3rem; overflow-wrap: anywhere; }
.size-badge { font-family: var(--font-display); font-size: 1.3rem; font-weight: 700; color: var(--accent); white-space: nowrap; }
.badges { display: flex; flex-wrap: wrap; gap: 5px; }
.badges:empty { display: none; }
.mini-specs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 12px; margin: 0; font-size: 0.84rem; }
.mini-specs div { display: flex; justify-content: space-between; gap: 8px; border-bottom: 1px dotted var(--line); padding-block: 2px; min-width: 0; }
.mini-specs dt { color: var(--ink-2); }
.mini-specs dd { margin: 0; font-family: var(--font-mono); text-align: right; overflow-wrap: anywhere; }
.card-actions { margin-top: auto; }
.loc-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; font-size: 0.88rem; }
.loc-list li { display: flex; flex-direction: column; }
.empty { text-align: center; padding: 34px 16px; display: flex; flex-direction: column; gap: 6px; align-items: center; }
.spec-dl { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); gap: 4px 18px; margin: 8px 0 0; }
.spec-dl div { display: flex; justify-content: space-between; gap: 10px; border-bottom: 1px dotted var(--line); padding-block: 4px; font-size: 0.88rem; min-width: 0; }
.spec-dl dt { color: var(--ink-2); }
.spec-dl dd { margin: 0; font-family: var(--font-mono); text-align: right; overflow-wrap: anywhere; }
.detail { display: flex; flex-direction: column; gap: 12px; }
.editor { display: flex; flex-direction: column; gap: 14px; }
.fs { border: 1px solid var(--line); border-radius: 9px; padding: 10px 12px 12px; margin: 0; min-width: 0; }
.fs legend { font-family: var(--font-display); font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; padding: 0 6px; }
.fs-grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 180px), 1fr)); }
.loc-edit { border-top: 1px dashed var(--line); padding-top: 10px; margin-top: 10px; display: flex; flex-direction: column; gap: 8px; }

/* plans */
.title-block { display: flex; flex-direction: column; gap: 10px; border: 2px solid var(--ink); }
.tb-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 200px), 1fr)); border-top: 1px solid var(--line); border-left: 1px solid var(--line); }
.tb-grid div { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 7px 10px; display: flex; flex-direction: column; min-width: 0; }
.tb-grid span { font-size: 0.68rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-2); }
